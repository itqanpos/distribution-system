<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>تسجيل الدخول · نظام POS</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <style>
        body.auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-elev);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: cardIn 0.5s ease;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-logo {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 20px;
            display: grid; place-items: center;
            color: #fff;
            font-size: 32px;
            box-shadow: 0 12px 30px -8px #4f46e5;
        }
        .auth-title {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-cash-register"></i></div>
        <h1 class="auth-title">نظام POS</h1>
        <p class="auth-subtitle">نظام إدارة المبيعات والمخزون</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>
            
            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>
            
            <button type="submit" class="btn btn--primary btn--lg btn--block" id="loginBtn">
                <span class="btn__text">تسجيل الدخول</span>
                <span class="spinner" hidden><i class="fas fa-circle-notch fa-spin"></i></span>
            </button>
        </form>
        
        <div class="auth-footer">
            ليس لديك حساب؟ <a href="./signup.html">أنشئ متجرك الآن</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/auth.js"></script>
    <script>
    (function() {
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const btnText = btn.querySelector('.btn__text');
        const spinner = btn.querySelector('.spinner');
        
        // If already logged in, redirect
        window.addEventListener('load', async () => {
            await new Promise(r => setTimeout(r, 500));
            const user = await Auth.getCurrentUser();
            if (user) {
                location.href = Auth.getRedirect(user);
            }
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btnText.hidden = true;
            spinner.hidden = false;
            
            try {
                const result = await Auth.login(email, password);
                if (result.success) {
                    location.href = result.redirect;
                }
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btnText.hidden = false;
                spinner.hidden = true;
            }
        });
        
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        }
    })();
    </script>
</body>
</html>
