<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تسجيل الدخول · حسابي</title>

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حسابي">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#3b82f6">

    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-input: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.05);
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-light: rgba(99,102,241,0.2);
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --border-medium: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, var(--primary-light) 0%, transparent 40%);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 35px 30px;
            border: 1px solid var(--border-light);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 2rem;
        }
        .logo-area h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .logo-area p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: border var(--transition);
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .input-wrapper i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 12px;
            color: var(--text-muted);
        }
        .toggle-password {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
        }
        .error-message {
            color: var(--danger);
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background var(--transition), opacity var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover { background: var(--primary-dark); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-login.loading .spinner { display: inline-block; }
        .btn-login.loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
        }
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .links a:hover { text-decoration: underline; }
        .links span { color: var(--text-muted); }

        .toast {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-surface);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-store"></i></div>
        <h1>حسابي</h1>
        <p>نظام إدارة المبيعات والمخزون</p>
    </div>

    <form id="loginForm" novalidate>
        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="example@domain.com" autocomplete="email" required>
            </div>
            <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="error-message" id="passwordError"></div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text">تسجيل الدخول</span>
            <div class="spinner"></div>
        </button>
    </form>

    <div class="links">
        <a href="#" id="forgotPasswordLink">نسيت كلمة المرور؟</a>
        <span> | </span>
        <a href="./signup.html">إنشاء حساب جديد</a>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- ملفات النظام -->
<script src="./js/supabase-core.js"></script>
<script src="./js/supabase-auth.js"></script>
<script src="./js/toast.js"></script>

<script>
    (function() {
        // العناصر
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const loginBtn = document.getElementById('loginBtn');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const toast = document.getElementById('toast');

        // إظهار/إخفاء كلمة المرور
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            const icon = togglePassword.querySelector('i');
            icon.classList.toggle('fa-eye', type === 'password');
            icon.classList.toggle('fa-eye-slash', type === 'text');
        });

        // التحقق من صحة البريد
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // عرض رسالة خطأ
        function showFieldError(el, msg) {
            el.textContent = msg;
            el.style.display = 'block';
        }
        function clearFieldErrors() {
            emailError.style.display = 'none';
            passwordError.style.display = 'none';
        }

        // عرض toast
        function showToast(msg, type = 'error') {
            if (window.Toast) {
                if (type === 'error') Toast.error(msg);
                else if (type === 'success') Toast.success(msg);
                else Toast.info(msg);
            } else {
                // fallback بسيط
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
        }

        // حالة التحميل
        function setLoading(loading) {
            loginBtn.disabled = loading;
            loginBtn.classList.toggle('loading', loading);
        }

        // تسجيل الدخول
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearFieldErrors();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            let hasError = false;
            if (!email) {
                showFieldError(emailError, 'البريد الإلكتروني مطلوب');
                hasError = true;
            } else if (!isValidEmail(email)) {
                showFieldError(emailError, 'صيغة البريد الإلكتروني غير صحيحة');
                hasError = true;
            }
            if (!password) {
                showFieldError(passwordError, 'كلمة المرور مطلوبة');
                hasError = true;
            }
            if (hasError) return;

            setLoading(true);
            try {
                const result = await window.App.login(email, password);
                if (result.success) {
                    showToast('تم تسجيل الدخول بنجاح', 'success');
                    setTimeout(() => {
                        window.location.href = result.redirectUrl || './dashboard.html';
                    }, 500);
                } else {
                    showToast(result.message || 'فشل تسجيل الدخول', 'error');
                }
            } catch (err) {
                console.error(err);
                if (err.message) {
                    if (err.message.includes('Invalid login credentials')) {
                        showFieldError(passwordError, 'البريد الإلكتروني أو كلمة المرور غير صحيحة');
                    } else {
                        showToast(err.message, 'error');
                    }
                } else {
                    showToast('فشل الاتصال بالخادم. تأكد من اتصالك بالإنترنت.', 'error');
                }
            } finally {
                setLoading(false);
            }
        });

        // نسيت كلمة المرور (مؤقت)
        document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
            e.preventDefault();
            showToast('خاصية استعادة كلمة المرور قيد التطوير', 'info');
        });

        // التركيز التلقائي على أول حقل فارغ
        if (!emailInput.value) emailInput.focus();
    })();
</script>

</body>
</html>
