<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>الفواتير · نظام POS</title>
    <meta name="description" content="سجل الفواتير - نظام POS">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#4f46e5">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="الفواتير">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/pos.css">
    <link rel="stylesheet" href="./css/invoices.css">

    <!-- منع وميض الثيم -->
    <script>
        (function(){
            try {
                var t = JSON.parse(localStorage.getItem('hesaby_theme') || '"light"');
                if (t === 'dark') document.documentElement.dataset.theme = 'dark';
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div id="loading-bar"></div>
    <div id="offline-banner"><i class="fas fa-wifi"></i> أنت غير متصل</div>

    <noscript>
        <div style="position:fixed;inset:0;background:#f5f5f5;display:grid;place-items:center;z-index:999999;padding:20px;text-align:center;font-family:Cairo,Arial,sans-serif;">
            <div>
                <h2 style="color:#ef4444;">JavaScript معطّل</h2>
                <p style="color:#666;">هذا التطبيق يتطلب تفعيل JavaScript للعمل. يرجى تفعيله ثم إعادة تحميل الصفحة.</p>
            </div>
        </noscript>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============ الشريط العلوي ============ -->
    <header class="topbar">
        <div class="topbar__left">
            <button class="icon-btn" id="menuBtn" aria-label="القائمة"><i class="fas fa-bars"></i></button>
            <div class="brand">
                <div class="brand__logo">
                    <img src="./icons/icon-192x192.png" alt="حسابي" class="js-logo-fallback">
                    <i class="fas fa-file-invoice" style="display:none;"></i>
                </div>
                <div class="brand__text">
                    <span class="brand__name">الفواتير</span>
                    <span class="brand__status" id="connStatus">متصل</span>
                </div>
            </div>
        </div>
        <div class="topbar__right">
            <button class="icon-btn" id="themeBtn" title="الوضع" aria-label="تبديل الوضع"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" id="exportBtn" title="تصدير" aria-label="تصدير CSV"><i class="fas fa-download"></i></button>
            <button class="icon-btn" id="refreshBtn" title="تحديث" aria-label="تحديث"><i class="fas fa-sync-alt"></i></button>
            <div class="user-chip">
                <div class="user-chip__avatar" id="userAvatar">U</div>
            </div>
        </div>
    </header>

    <!-- ============ القائمة الجانبية ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <div class="brand__logo">
                <img src="./icons/icon-192x192.png" alt="حسابي" class="js-logo-fallback">
                <i class="fas fa-cash-register" style="display:none;"></i>
            </div>
            <h3 id="sidebarUserName">مدير</h3>
        </div>
        <nav class="sidebar__nav">
            <a href="./dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
            <a href="./pos.html" class="nav-item"><i class="fas fa-cash-register"></i> نقطة البيع</a>
            <a href="./invoices.html" class="nav-item active"><i class="fas fa-file-invoice"></i> الفواتير</a>
            <a href="./purchases.html" class="nav-item"><i class="fas fa-shopping-cart"></i> المشتريات</a>
            <a href="./returns.html" class="nav-item"><i class="fas fa-undo-alt"></i> المرتجعات</a>
            <a href="./cashbox.html" class="nav-item"><i class="fas fa-money-bill-wave"></i> الصندوق</a>
            <a href="./accounting.html" class="nav-item"><i class="fas fa-calculator"></i> المحاسبة</a>
            <a href="./reports.html" class="nav-item"><i class="fas fa-chart-bar"></i> التقارير</a>
            <a href="./customers.html" class="nav-item"><i class="fas fa-users"></i> العملاء</a>
            <a href="./suppliers.html" class="nav-item"><i class="fas fa-truck"></i> الموردين</a>
            <a href="./products.html" class="nav-item"><i class="fas fa-boxes"></i> المنتجات</a>
            <a href="./inventory.html" class="nav-item"><i class="fas fa-warehouse"></i> المخزون</a>
            <a href="./users.html" class="nav-item"><i class="fas fa-user-shield"></i> المستخدمين</a>
            <a href="./settings.html" class="nav-item"><i class="fas fa-cog"></i> الإعدادات</a>
            <a href="#" class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>
    </aside>

    <!-- ============ المحتوى الرئيسي ============ -->
    <main class="main-container">

        <div class="page-head">
            <div class="page-head__info">
                <h1>الفواتير</h1>
                <p id="invoicesCount">0 فاتورة</p>
            </div>
            <button class="btn btn--primary" id="newInvoiceBtn">
                <i class="fas fa-plus"></i>
                <span>فاتورة جديدة</span>
            </button>
        </div>

        <!-- ملخص سريع -->
        <div class="summary-cards" id="summaryCards"></div>

        <!-- شريط البحث والفلاتر -->
        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث برقم الفاتورة أو اسم العميل..." autocomplete="off">
                <button class="search-clear" id="clearSearchBtn" style="display:none;" aria-label="مسح البحث">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <select id="typeFilter" class="filter-select" aria-label="نوع الفاتورة">
                <option value="">كل الأنواع</option>
                <option value="sale">مبيعات</option>
                <option value="purchase">مشتريات</option>
                <option value="return_sale">مرتجع بيع</option>
                <option value="return_purchase">مرتجع شراء</option>
            </select>
            <select id="statusFilter" class="filter-select" aria-label="حالة الفاتورة">
                <option value="">كل الحالات</option>
                <option value="paid">مدفوعة</option>
                <option value="partial">جزئية</option>
                <option value="credit">آجلة</option>
                <option value="held">معلقة</option>
                <option value="voided">ملغية</option>
            </select>
            <select id="dateFilter" class="filter-select" aria-label="الفترة">
                <option value="">كل الفترات</option>
                <option value="today">اليوم</option>
                <option value="week">هذا الأسبوع</option>
                <option value="month">هذا الشهر</option>
                <option value="year">هذه السنة</option>
            </select>
            <select id="sortFilter" class="filter-select" aria-label="ترتيب">
                <option value="recent">الأحدث</option>
                <option value="oldest">الأقدم</option>
                <option value="amount-desc">الأعلى مبلغاً</option>
                <option value="amount">الأقل مبلغاً</option>
            </select>
        </div>

        <!-- قائمة الفواتير -->
        <div class="invoices-container">
            <div class="invoices-grid-view" id="invoicesGridView"></div>
            <div class="invoices-list-view" id="invoicesListView"></div>

            <div class="empty-state" id="emptyState" style="display:none;">
                <i class="fas fa-file-invoice"></i>
                <h3>لا توجد فواتير</h3>
                <p>ابدأ بإنشاء فاتورة جديدة</p>
                <button class="btn btn--primary" id="emptyNewInvoiceBtn" type="button">
                    <i class="fas fa-plus"></i> فاتورة جديدة
                </button>
            </div>

            <div class="skeleton-grid" id="skeletonGrid" style="display:none;"></div>
        </div>
    </main>

    <!-- ============ مودال تفاصيل الفاتورة ============ -->
    <div class="modal" id="invoiceDetailsModal">
        <div class="modal__content receipt-modal-content">
            <div class="receipt-header">
                <button id="closeDetailsModalBtn" class="close-btn" aria-label="إغلاق">&times;</button>
            </div>
            <div id="invoiceDetailsContent"></div>
            <div class="receipt-actions" style="flex-wrap:wrap;">
                <button class="btn btn--primary" id="printInvoiceBtn" type="button" style="flex:1;min-width:100px;">
                    <i class="fas fa-print"></i> طباعة
                </button>
                <button class="btn btn--ghost" id="voidInvoiceBtn" type="button" style="flex:1;min-width:100px;display:none;">
                    <i class="fas fa-ban"></i> إلغاء الفاتورة
                </button>
                <button class="btn btn--ghost" id="editInvoiceBtn" type="button" style="flex:1;min-width:100px;">
                    <i class="fas fa-edit"></i> تعديل
                </button>
                <button class="btn btn--cancel" id="closeDetailsModalBtn2" type="button" style="flex:1;min-width:100px;">
                    إغلاق
                </button>
            </div>
        </div>
    </div>

    <div id="toastStack" class="toast-stack"></div>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="./js/config.js"></script>
    <script defer src="./js/utils.js"></script>
    <script defer src="./js/toast.js"></script>
    <script defer src="./js/db.js"></script>
    <script defer src="./js/auth.js"></script>
    <script defer src="./js/invoices.js"></script>

    <!-- Post-load: SW + theme-color + logo fallback + empty-state button -->
    <script>
    (function() {
        'use strict';

        /* ============ فشل تحميل الشعار ============ */
        document.querySelectorAll('.js-logo-fallback').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                const sibling = this.nextElementSibling;
                if (sibling) sibling.style.display = 'grid';
            });
        });

        /* ============ مزامنة theme-color ============ */
        function syncThemeColor() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#1e1b4b' : '#4f46e5');
        }
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(
            document.documentElement,
            { attributes: true, attributeFilter: ['data-theme'] }
        );

        /* ============ empty-state → فاتورة جديدة ============ */
        document.getElementById('emptyNewInvoiceBtn')?.addEventListener('click', () => {
            document.getElementById('newInvoiceBtn')?.click();
        });

        /* ============ تسجيل Service Worker ============ */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register(
                        './service-worker.js',
                        { scope: './', updateViaCache: 'none' }
                    );

                    reg.addEventListener('updatefound', () => {
                        const nw = reg.installing;
                        if (!nw) return;
                        nw.addEventListener('statechange', () => {
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                if (confirm('يتوفر تحديث جديد. إعادة التحميل الآن؟')) {
                                    nw.postMessage({ type: 'SKIP_WAITING' });
                                }
                            }
                        });
                    });

                    let reloaded = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (reloaded) return;
                        reloaded = true;
                        window.location.reload();
                    });

                    navigator.serviceWorker.addEventListener('message', (event) => {
                        if (event.data?.type === 'SYNC_NOW' && window.DB?.flushSyncQueue) {
                            window.DB.flushSyncQueue().catch(() => {});
                        }
                    });
                } catch (e) {
                    console.warn('SW registration failed', e);
                }
            });
        }

        /* ============ فحص تحميل Supabase ============ */
        window.addEventListener('load', () => {
            if (typeof window.supabase === 'undefined') {
                const stack = document.getElementById('toastStack');
                if (stack) {
                    const el = document.createElement('div');
                    el.style.cssText = 'padding:12px 22px;background:#ef4444;color:#fff;border-radius:12px;font-weight:700;font-size:14px;';
                    el.textContent = 'فشل تحميل مكتبة الاتصال. تحقق من الإنترنت وأعد التحميل.';
                    stack.appendChild(el);
                }
            }
        });
    })();
    </script>
</body>
</html>
