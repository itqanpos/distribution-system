    <!-- Post-load: SW + theme-color + logo fallback -->
    <script>
    (function() {
        'use strict';

        /* ============ فشل تحميل الشعار ============ */
        document.querySelectorAll('.js-logo-fallback').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                const sibling = this.nextElementSibling;
                if (sibling) sibling.style.display = 'grid';
            });
        });

        /* ============ مزامنة theme-color ============ */
        function syncThemeColor() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#1e1b4b' : '#4f46e5');
        }
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(
            document.documentElement,
            { attributes: true, attributeFilter: ['data-theme'] }
        );

        /* ============ تسجيل Service Worker ============ */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register(
                        './service-worker.js',
                        { scope: './', updateViaCache: 'none' }
                    );

                    reg.addEventListener('updatefound', () => {
                        const nw = reg.installing;
                        if (!nw) return;
                        nw.addEventListener('statechange', () => {
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                if (confirm('يتوفر تحديث جديد. إعادة التحميل الآن؟')) {
                                    nw.postMessage({ type: 'SKIP_WAITING' });
                                }
                            }
                        });
                    });

                    let reloaded = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (reloaded) return;
                        reloaded = true;
                        window.location.reload();
                    });

                    navigator.serviceWorker.addEventListener('message', (event) => {
                        if (event.data?.type === 'SYNC_NOW' && window.DB?.flushSyncQueue) {
                            window.DB.flushSyncQueue().catch(() => {});
                        }
                    });
                } catch (e) {
                    console.warn('SW registration failed', e);
                }
            });
        }
    })();
    </script>
