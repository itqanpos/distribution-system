<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>المنتجات · نظام POS</title>
    <meta name="description" content="إدارة المنتجات والوحدات - نظام POS">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#4f46e5">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="المنتجات">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/pos.css">
    <link rel="stylesheet" href="./css/products.css">

    <!-- منع وميض الثيم -->
    <script>
        (function(){
            try {
                var t = JSON.parse(localStorage.getItem('hesaby_theme') || '"light"');
                if (t === 'dark') document.documentElement.dataset.theme = 'dark';
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div id="loading-bar"></div>
    <div id="offline-banner"><i class="fas fa-wifi"></i> أنت غير متصل</div>

    <noscript>
        <div style="position:fixed;inset:0;background:#f5f5f5;display:grid;place-items:center;z-index:999999;padding:20px;text-align:center;font-family:Cairo,Arial,sans-serif;">
            <div>
                <h2 style="color:#ef4444;">JavaScript معطّل</h2>
                <p style="color:#666;">هذا التطبيق يتطلب تفعيل JavaScript للعمل. يرجى تفعيله ثم إعادة تحميل الصفحة.</p>
            </div>
        </noscript>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============ الشريط العلوي ============ -->
    <header class="topbar">
        <div class="topbar__left">
            <button class="icon-btn" id="menuBtn" aria-label="القائمة"><i class="fas fa-bars"></i></button>
            <div class="brand">
                <div class="brand__logo">
                    <img src="./icons/icon-192x192.png" alt="حسابي" class="js-logo-fallback">
                    <i class="fas fa-boxes" style="display:none;"></i>
                </div>
                <div class="brand__text">
                    <span class="brand__name">المنتجات</span>
                    <span class="brand__status" id="connStatus">متصل</span>
                </div>
            </div>
        </div>
        <div class="topbar__right">
            <button class="icon-btn" id="themeBtn" title="الوضع" aria-label="تبديل الوضع"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" id="exportBtn" title="تصدير" aria-label="تصدير CSV"><i class="fas fa-download"></i></button>
            <button class="icon-btn" id="refreshBtn" title="تحديث" aria-label="تحديث"><i class="fas fa-sync-alt"></i></button>
            <div class="user-chip">
                <div class="user-chip__avatar" id="userAvatar">U</div>
            </div>
        </div>
    </header>

    <!-- ============ القائمة الجانبية ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <div class="brand__logo">
                <img src="./icons/icon-192x192.png" alt="حسابي" class="js-logo-fallback">
                <i class="fas fa-cash-register" style="display:none;"></i>
            </div>
            <h3 id="sidebarUserName">مدير</h3>
        </div>
        <nav class="sidebar__nav">
            <a href="./dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
            <a href="./pos.html" class="nav-item"><i class="fas fa-cash-register"></i> نقطة البيع</a>
            <a href="./invoices.html" class="nav-item"><i class="fas fa-file-invoice"></i> الفواتير</a>
            <a href="./purchases.html" class="nav-item"><i class="fas fa-shopping-cart"></i> المشتريات</a>
            <a href="./returns.html" class="nav-item"><i class="fas fa-undo-alt"></i> المرتجعات</a>
            <a href="./cashbox.html" class="nav-item"><i class="fas fa-money-bill-wave"></i> الصندوق</a>
            <a href="./accounting.html" class="nav-item"><i class="fas fa-calculator"></i> المحاسبة</a>
            <a href="./reports.html" class="nav-item"><i class="fas fa-chart-bar"></i> التقارير</a>
            <a href="./customers.html" class="nav-item"><i class="fas fa-users"></i> العملاء</a>
            <a href="./suppliers.html" class="nav-item"><i class="fas fa-truck"></i> الموردين</a>
            <a href="./products.html" class="nav-item active"><i class="fas fa-boxes"></i> المنتجات</a>
            <a href="./inventory.html" class="nav-item"><i class="fas fa-warehouse"></i> المخزون</a>
            <a href="./users.html" class="nav-item"><i class="fas fa-user-shield"></i> المستخدمين</a>
            <a href="./settings.html" class="nav-item"><i class="fas fa-cog"></i> الإعدادات</a>
            <a href="#" class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>
    </aside>

    <!-- ============ المحتوى الرئيسي ============ -->
    <main class="main-container">

        <div class="page-head">
            <div class="page-head__info">
                <h1>المنتجات</h1>
                <p id="productsCount">0 منتج</p>
            </div>
            <button class="btn btn--primary" id="addProductBtn" type="button">
                <i class="fas fa-plus"></i>
                <span>منتج جديد</span>
            </button>
        </div>

        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث بالاسم، الكود، أو الباركود..." autocomplete="off">
                <button class="search-clear" id="clearSearchBtn" style="display:none;" aria-label="مسح البحث" type="button">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <select id="categoryFilter" class="filter-select" aria-label="التصنيف">
                <option value="">كل التصنيفات</option>
            </select>
            <select id="stockFilter" class="filter-select" aria-label="حالة المخزون">
                <option value="">كل الحالات</option>
                <option value="in">متوفر</option>
                <option value="low">مخزون منخفض (≤5)</option>
                <option value="out">نفذ</option>
            </select>
            <select id="sortFilter" class="filter-select" aria-label="ترتيب">
                <option value="name">الاسم (أ-ي)</option>
                <option value="name-desc">الاسم (ي-أ)</option>
                <option value="price">السعر (تصاعدي)</option>
                <option value="price-desc">السعر (تنازلي)</option>
                <option value="stock">المخزون (تصاعدي)</option>
                <option value="recent">الأحدث</option>
            </select>
        </div>

        <div class="products-container">
            <div class="products-grid-view" id="productsGridView"></div>
            <div class="products-list-view" id="productsListView"></div>

            <div class="empty-state" id="emptyState" style="display:none;">
                <i class="fas fa-box-open"></i>
                <h3>لا توجد منتجات</h3>
                <p>ابدأ بإضافة منتج جديد</p>
                <button class="btn btn--primary" id="emptyAddProductBtn" type="button">
                    <i class="fas fa-plus"></i> إضافة منتج
                </button>
            </div>

            <div class="skeleton-grid" id="skeletonGrid" style="display:none;"></div>
        </div>

        <button class="fab-add" id="fabAddBtn" aria-label="إضافة منتج" type="button">
            <i class="fas fa-plus"></i>
        </button>
    </main>

    <!-- ============ مودال إضافة/تعديل منتج ============ -->
    <div class="modal" id="productModal">
        <div class="modal__content modal__content--lg">
            <div class="modal__header">
                <h2 id="modalTitle">إضافة منتج جديد</h2>
                <button class="icon-btn" data-close="productModal" type="button" aria-label="إغلاق"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal__body">
                <form id="productForm" novalidate>
                    <input type="hidden" id="productId">

                    <!-- المعلومات الأساسية -->
                    <div class="form-section">
                        <div class="form-section__title">
                            <i class="fas fa-info-circle"></i>
                            المعلومات الأساسية
                        </div>

                        <div class="form-group">
                            <label for="productName">اسم المنتج <span class="required">*</span></label>
                            <input type="text" id="productName" required placeholder="مثال: قهوة عربية" autocomplete="off">
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label for="productCode">كود المنتج</label>
                                <input type="text" id="productCode" placeholder="اختياري" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label for="productBarcode">الباركود</label>
                                <input type="text" id="productBarcode" placeholder="اختياري" inputmode="numeric" autocomplete="off">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="productCategory">التصنيف</label>
                            <div class="category-input-wrap">
                                <input type="text" id="productCategory" list="categoryList" placeholder="اختر أو اكتب تصنيفاً جديداً" autocomplete="off">
                                <datalist id="categoryList"></datalist>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="productDescription">الوصف</label>
                            <textarea id="productDescription" rows="2" placeholder="وصف اختياري..."></textarea>
                        </div>
                    </div>

                    <!-- الوحدات -->
                    <div class="form-section">
                        <div class="form-section__title">
                            <i class="fas fa-cubes"></i>
                            الوحدات والأسعار
                            <button type="button" class="btn-add-unit" id="addUnitBtn">
                                <i class="fas fa-plus-circle"></i> إضافة وحدة
                            </button>
                        </div>

                        <div class="units-container" id="unitsContainer"></div>
                        <small class="form-hint">
                            <i class="fas fa-info-circle"></i>
                            الوحدة الأولى هي الوحدة الأساسية (تُحسب بها المخزون)
                        </small>
                    </div>
                </form>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close="productModal" type="button">إلغاء</button>
                <button class="btn btn--primary" id="saveProductBtn" type="button">
                    <i class="fas fa-save"></i> حفظ المنتج
                </button>
            </div>
        </div>
    </div>

    <!-- ============ مودال تأكيد الحذف ============ -->
    <div class="modal" id="confirmDeleteModal">
        <div class="modal__content modal__content--sm">
            <div class="modal__header">
                <h2>تأكيد الحذف</h2>
                <button class="icon-btn" data-close="confirmDeleteModal" type="button" aria-label="إغلاق"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal__body">
                <div class="confirm-delete">
                    <div class="confirm-delete__icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <p>هل أنت متأكد من حذف هذا المنتج؟</p>
                    <p class="confirm-delete__name" id="deleteProductName"></p>
                    <small>لا يمكن التراجع عن هذا الإجراء</small>
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close="confirmDeleteModal" type="button">إلغاء</button>
                <button class="btn btn--danger" id="confirmDeleteBtn" type="button">
                    <i class="fas fa-trash"></i> حذف نهائياً
                </button>
            </div>
        </div>
    </div>

    <!-- ============ مودال تفاصيل المنتج ============ -->
    <div class="modal" id="viewProductModal">
        <div class="modal__content modal__content--lg">
            <div class="modal__header">
                <h2>تفاصيل المنتج</h2>
                <button class="icon-btn" data-close="viewProductModal" type="button" aria-label="إغلاق"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal__body" id="viewProductBody"></div>
            <div class="modal__footer">
                <button class="btn btn--ghost" id="editFromViewBtn" type="button">
                    <i class="fas fa-edit"></i> تعديل
                </button>
                <button class="btn btn--primary" id="closeViewBtn" type="button">
                    <i class="fas fa-check"></i> حسناً
                </button>
            </div>
        </div>
    </div>

    <!-- ============ مودال تأكيد الوحدة ============ -->
    <div class="modal" id="confirmUnitDeleteModal">
        <div class="modal__content modal__content--sm">
            <div class="modal__header">
                <h2>حذف الوحدة</h2>
                <button class="icon-btn" data-close="confirmUnitDeleteModal" type="button" aria-label="إغلاق"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal__body">
                <p style="text-align:center;padding:16px 0;font-weight:700;">
                    هل تريد حذف هذه الوحدة؟
                </p>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close="confirmUnitDeleteModal" type="button">إلغاء</button>
                <button class="btn btn--danger" id="confirmUnitDeleteBtn" type="button">حذف</button>
            </div>
        </div>
    </div>

    <div id="toastStack" class="toast-stack"></div>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="./js/config.js"></script>
    <script defer src="./js/utils.js"></script>
    <script defer src="./js/toast.js"></script>
    <script defer src="./js/db.js"></script>
    <script defer src="./js/auth.js"></script>
    <script defer src="./js/products.js"></script>

    <!-- Post-load: SW + theme-color + logo fallback + empty-state button -->
    <script>
    (function() {
        'use strict';

        /* ============ فشل تحميل الشعار ============ */
        document.querySelectorAll('.js-logo-fallback').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                const sibling = this.nextElementSibling;
                if (sibling) sibling.style.display = 'grid';
            });
        });

        /* ============ مزامنة theme-color ============ */
        function syncThemeColor() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#1e1b4b' : '#4f46e5');
        }
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(
            document.documentElement,
            { attributes: true, attributeFilter: ['data-theme'] }
        );

        /* ============ empty-state → add ============ */
        document.getElementById('emptyAddProductBtn')?.addEventListener('click', () => {
            document.getElementById('addProductBtn')?.click();
        });

        /* ============ تسجيل Service Worker ============ */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register(
                        './service-worker.js',
                        { scope: './', updateViaCache: 'none' }
                    );

                    reg.addEventListener('updatefound', () => {
                        const nw = reg.installing;
                        if (!nw) return;
                        nw.addEventListener('statechange', () => {
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                if (confirm('يتوفر تحديث جديد. إعادة التحميل الآن؟')) {
                                    nw.postMessage({ type: 'SKIP_WAITING' });
                                }
                            }
                        });
                    });

                    let reloaded = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (reloaded) return;
                        reloaded = true;
                        window.location.reload();
                    });

                    navigator.serviceWorker.addEventListener('message', (event) => {
                        if (event.data?.type === 'SYNC_NOW' && window.DB?.flushSyncQueue) {
                            window.DB.flushSyncQueue().catch(() => {});
                        }
                    });
                } catch (e) {
                    console.warn('SW registration failed', e);
                }
            });
        }

        /* ============ فحص تحميل Supabase ============ */
        window.addEventListener('load', () => {
            if (typeof window.supabase === 'undefined') {
                const stack = document.getElementById('toastStack');
                if (stack) {
                    const el = document.createElement('div');
                    el.style.cssText = 'padding:12px 22px;background:#ef4444;color:#fff;border-radius:12px;font-weight:700;font-size:14px;';
                    el.textContent = 'فشل تحميل مكتبة الاتصال. تحقق من الإنترنت وأعد التحميل.';
                    stack.appendChild(el);
                }
            }
        });
    })();
    </script>
</body>
</html>
