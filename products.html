<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المنتجات · حسابي</title>
    
    <link rel="icon" href="./icons/icon-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#3b82f6">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/products.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<nav class="navbar" id="mainNavbar">
    <div class="navbar-left">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="logo">
            <div class="logo-icon">
                <img src="./icons/icon-192x192.png" alt="حسابي" style="width:38px;height:38px;object-fit:contain;border-radius:10px;"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                <i class="fas fa-store" style="display:none;font-size:20px;color:white;"></i>
            </div>
            <div class="logo-text"><h2>حسابي</h2></div>
        </div>
    </div>
    <div class="navbar-right">
        <div class="nav-actions">
            <button class="navbar-icon-btn" id="syncBtn" title="مزامنة"><i class="fas fa-sync-alt"></i></button>
            <button class="navbar-icon-btn" id="moreMenuBtn" title="المزيد"><i class="fas fa-ellipsis-v"></i></button>
            <div class="more-dropdown" id="moreDropdown">
                <a href="./settings.html"><i class="fas fa-cog"></i> الإعدادات</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
            </div>
        </div>
    </div>
</nav>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">U</div>
        <h4 id="sidebarUserName">مدير النظام</h4>
    </div>
    <ul class="menu">
        <div class="menu-section">الرئيسية</div>
        <li><a class="menu-item" href="./dashboard.html"><i class="fas fa-tachometer-alt"></i><span>لوحة التحكم</span></a></li>
        <li><a class="menu-item" href="./pos.html"><i class="fas fa-cash-register"></i><span>نقطة البيع</span></a></li>
        <li><a class="menu-item" href="./invoices.html"><i class="fas fa-file-invoice"></i><span>الفواتير</span></a></li>
        <li><a class="menu-item" href="./purchases.html"><i class="fas fa-shopping-cart"></i><span>المشتريات</span></a></li>
        <li><a class="menu-item" href="./cashbox.html"><i class="fas fa-money-bill-wave"></i><span>الصندوق</span></a></li>
        <li><a class="menu-item" href="./accounting.html"><i class="fas fa-calculator"></i><span>المحاسبة</span></a></li>
        <li><a class="menu-item" href="./reports.html"><i class="fas fa-chart-bar"></i><span>التقارير</span></a></li>
        <li><a class="menu-item" href="./customers.html"><i class="fas fa-user-tie"></i><span>العملاء والموردين</span></a></li>
        <li><a class="menu-item active" href="./products.html"><i class="fas fa-boxes"></i><span>المنتجات</span></a></li>
        <li><a class="menu-item" href="./settings.html"><i class="fas fa-cog"></i><span>الإعدادات</span></a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="page-header">
        <div class="page-title">
            <h1><i class="fas fa-boxes"></i> المنتجات</h1>
            <span class="product-count" id="productCount">0 منتج</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" id="addProductBtn"><i class="fas fa-plus"></i> إضافة منتج</button>
            <button class="btn btn-icon" id="refreshBtn" title="تحديث"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الكود أو الباركود..." autocomplete="off">
        </div>
        <div class="view-toggle">
            <button class="view-btn active" data-view="grid"><i class="fas fa-th-large"></i></button>
            <button class="view-btn" data-view="table"><i class="fas fa-list"></i></button>
        </div>
    </div>

    <div id="productsContainer" class="products-grid">
        <!-- سيتم تعبئته عبر JS -->
    </div>

    <div id="loadMoreSentinel"></div>
</main>

<!-- اللوحة الجانبية للمنتج -->
<div class="side-panel" id="productPanel">
    <div class="panel-header">
        <h2 id="panelTitle">تفاصيل المنتج</h2>
        <button class="close-panel-btn" id="closePanelBtn">&times;</button>
    </div>
    <div class="panel-tabs">
        <button class="tab active" data-tab="basic">أساسي</button>
        <button class="tab" data-tab="units">الوحدات</button>
        <button class="tab" data-tab="stock">المخزون</button>
    </div>
    <div class="panel-body" id="panelBody">
        <!-- المحتوى الديناميكي -->
    </div>
    <div class="panel-footer">
        <button class="btn btn-cancel" id="cancelPanelBtn">إلغاء</button>
        <button class="btn btn-primary" id="saveProductBtn">حفظ</button>
    </div>
</div>

<!-- مودال تأكيد الحذف -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <h3>تأكيد الحذف</h3>
        <p id="deleteMsg">هل أنت متأكد من حذف هذا المنتج؟</p>
        <div class="modal-actions">
            <button class="btn btn-cancel" id="cancelDeleteBtn">إلغاء</button>
            <button class="btn btn-danger" id="confirmDeleteBtn">حذف</button>
        </div>
    </div>
</div>

<div class="toast" id="toastContainer"></div>

<script src="./js/supabase-core.js"></script>
<script src="./js/supabase-auth.js"></script>
<script src="./js/db-local.js"></script>
<script src="./js/supabase-offline.js"></script>
<script src="./js/supabase-db.js"></script>
<script src="./js/toast.js"></script>
<script src="./js/products.js"></script>
</body>
</html>
