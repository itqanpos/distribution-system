<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>إنشاء متجر جديد · نظام POS</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <style>
        body.auth-page {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-card {
            width: 100%; max-width: 480px;
            background: var(--bg-elev); border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo {
            width: 72px; height: 72px; margin: 0 auto 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 20px; display: grid; place-items: center;
            color: #fff; font-size: 32px;
            box-shadow: 0 12px 30px -8px #10b981;
        }
        .auth-title { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .auth-subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
        .auth-footer { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 14px; }
        .auth-footer a { color: var(--primary); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-store"></i></div>
        <h1 class="auth-title">إنشاء متجر جديد</h1>
        <p class="auth-subtitle">ابدأ إدارة مبيعاتك في دقيقة واحدة</p>
        
        <form id="signupForm">
            <div class="form-group">
                <label>الاسم الكامل *</label>
                <div class="input-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullName" required autocomplete="name">
                </div>
            </div>
            
            <div class="form-group">
                <label>اسم المتجر *</label>
                <div class="input-wrap">
                    <i class="fas fa-store"></i>
                    <input type="text" id="storeName" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>البريد الإلكتروني *</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" required autocomplete="email">
                </div>
            </div>
            
            <div class="form-group">
                <label>رقم الهاتف</label>
                <div class="input-wrap">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="phone" autocomplete="tel">
                </div>
            </div>
            
            <div class="form-group">
                <label>كلمة المرور *</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" required minlength="6" autocomplete="new-password">
                </div>
                <small style="color: var(--text-muted); font-size: 12px;">6 أحرف على الأقل</small>
            </div>
            
            <div class="form-group">
                <label>تأكيد كلمة المرور *</label>
                <div class="input-wrap">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="passwordConfirm" required autocomplete="new-password">
                </div>
            </div>
            
            <button type="submit" class="btn btn--success btn--lg btn--block" id="signupBtn">
                <span class="btn__text">إنشاء المتجر</span>
                <span class="spinner" hidden><i class="fas fa-circle-notch fa-spin"></i></span>
            </button>
        </form>
        
        <div class="auth-footer">
            لديك حساب؟ <a href="./index.html">تسجيل الدخول</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/auth.js"></script>
    <script>
    (function() {
        const form = document.getElementById('signupForm');
        const btn = document.getElementById('signupBtn');
        const btnText = btn.querySelector('.btn__text');
        const spinner = btn.querySelector('.spinner');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const storeName = document.getElementById('storeName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            
            if (password !== passwordConfirm) {
                alert('كلمتا المرور غير متطابقتين');
                return;
            }
            
            btn.disabled = true;
            btnText.hidden = true;
            spinner.hidden = false;
            
            try {
                const result = await Auth.signup(email, password, fullName, storeName, phone);
                if (result.success) {
                    alert('تم إنشاء المتجر بنجاح!');
                    setTimeout(() => location.href = './dashboard.html', 800);
                }
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btnText.hidden = false;
                spinner.hidden = true;
            }
        });
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        }
    })();
    </script>
</body>
</html>
