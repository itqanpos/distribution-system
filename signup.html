<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="إنشاء متجر جديد في نظام حسابي">
    <title>إنشاء متجر · حسابي</title>

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="حسابي">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#f8fafc">

    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --radius: 20px;
            --transition: 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #e9eef3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signup-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px 32px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: #eef2ff;
            color: #2563eb;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .logo h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
        }
        .logo p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 15px;
            width: 100%;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 8px 20px -10px rgba(37,99,235,0.4);
        }
        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            margin-top: 24px;
            text-align: center;
            font-size: 15px;
            color: var(--text-secondary);
        }
        .login-link a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
        .login-link a:hover { text-decoration: underline; }

        .error-msg {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .signup-card { padding: 32px 22px; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="signup-card">

            <div class="logo">
                <div class="logo-icon"><i class="fas fa-store-alt"></i></div>
                <h1>إنشاء متجر</h1>
                <p>ابدأ إدارة أعمالك مع حسابي</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label>اسم المتجر</label>
                <input type="text" id="tenantName" placeholder="مثال: متجر النور" autocomplete="organization">
            </div>

            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="fullName" placeholder="الاسم الكامل" autocomplete="name">
            </div>

            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="01xxxxxxxxx" autocomplete="tel">
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@email.com" autocomplete="email" inputmode="email">
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="********" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" id="passwordConfirm" placeholder="********" autocomplete="new-password">
            </div>

            <button class="btn" id="signupBtn">إنشاء الحساب</button>

            <div class="login-link">
                لديك حساب بالفعل؟ <a href="./index.html">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-core.js"></script>
    <script src="./js/supabase-auth.js"></script>
    <script src="./js/toast.js"></script>

    <script>
        (() => {
            const tenantName = document.getElementById('tenantName');
            const fullName = document.getElementById('fullName');
            const phone = document.getElementById('phone');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const passwordConfirm = document.getElementById('passwordConfirm');
            const signupBtn = document.getElementById('signupBtn');
            const errorMsg = document.getElementById('errorMsg');

            function showError(message) {
                errorMsg.textContent = message;
                errorMsg.style.display = 'block';
            }
            function hideError() {
                errorMsg.style.display = 'none';
            }

            function waitForApp(timeoutMs = 8000) {
                return new Promise((resolve, reject) => {
                    const start = Date.now();
                    const check = () => {
                        if (window.App && typeof App.signup === 'function') {
                            resolve();
                        } else if (Date.now() - start > timeoutMs) {
                            reject(new Error('النواة غير محملة'));
                        } else {
                            setTimeout(check, 200);
                        }
                    };
                    check();
                });
            }

            async function performSignup() {
                hideError();

                const storeName = tenantName.value.trim();
                const name = fullName.value.trim();
                const phoneNumber = phone.value.trim();
                const mail = email.value.trim();
                const pass = password.value;
                const passConfirm = passwordConfirm.value;

                if (!storeName || !name || !mail || !pass) {
                    showError('يرجى ملء جميع الحقول المطلوبة');
                    return;
                }
                if (pass !== passConfirm) {
                    showError('كلمتا المرور غير متطابقتين');
                    return;
                }
                if (pass.length < 6) {
                    showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                    return;
                }
                if (!window.App || typeof App.signup !== 'function') {
                    showError('النظام غير جاهز، حاول مرة أخرى');
                    return;
                }

                signupBtn.disabled = true;
                signupBtn.textContent = 'جاري الإنشاء...';

                try {
                    const result = await App.signup(mail, pass, name, 'admin', storeName, phoneNumber);
                    if (result.success) {
                        window.Toast?.success(result.message || 'تم إنشاء الحساب بنجاح');
                        if (result.redirectUrl) {
                            setTimeout(() => window.location.href = result.redirectUrl, 1500);
                        } else {
                            setTimeout(() => window.location.href = './dashboard.html', 1500);
                        }
                    } else {
                        showError(result.message || 'فشل إنشاء الحساب');
                    }
                } catch (e) {
                    showError(e.message || 'حدث خطأ غير متوقع');
                } finally {
                    signupBtn.disabled = false;
                    signupBtn.textContent = 'إنشاء الحساب';
                }
            }

            signupBtn.addEventListener('click', performSignup);

            // دعم الإدخال بالـ Enter
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') performSignup();
                });
            });

            tenantName.focus();
        })();
    </script>
</body>
</html>
