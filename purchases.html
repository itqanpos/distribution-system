<body>

    <div id="offline-banner"><i class="fas fa-wifi"></i> أنت غير متصل</div>

    <noscript>
        <div style="position:fixed;inset:0;background:#f5f5f5;display:grid;place-items:center;z-index:999999;padding:20px;text-align:center;font-family:Cairo,Arial,sans-serif;">
            <div>

                <p style="color:#666;">هذا التطبيق يتطلب تفعيل JavaScript للعمل. يرجى تفعيله ثم إعادة تحميل الصفحة.</p>
            </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============ الشريط العلوي ============ -->

            <button class="icon-btn" id="menuBtn" aria-label="القائمة"><i class="fas fa-bars"></i></button>
            <div class="brand">

                    <img src="./icons/icon-192x192.png" alt="حسابي" class="js-logo-fallback">
                    <i class="fas fa-shopping-cart" style="display:none;"></i>
                </div>
                <div class="brand__text">
                    <span class="brand__name">المشتريات</span>
                    <span class="brand__status" id="connStatus">متصل</span>
                </div>
            </div>
        </div>
        <div class="topbar__right">
            <button class="icon-btn" id="themeBtn" title="الوضع" aria-label="تبديل الوضع"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" id="exportBtn" title="تصدير" aria-label="تصدير CSV"><i class="fas fa-download"></i></button>
            <button class="icon-btn" id="refreshBtn" title="تحديث" aria-label="تحديث"><i class="fas fa-sync-alt"></i></button>
            <div class="user-chip">

    </header>

    <!-- ============ القائمة الجانبية ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <div class="brand__logo">
                <img src="./icons/icon-192x192.png" alt="حسابي" class="js-logo-fallback">
                <i class="fas fa-cash-register" style="display:none;"></i>
            </div>
            <h3 id="sidebarUserName">مدير</h3>
        </div>
        <nav class="sidebar__nav">
            <a href="./dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
            <a href="./pos.html" class="nav-item"><i class="fas fa-cash-register"></i> نقطة البيع</a>
            <a href="./invoices.html" class="nav-item"><i class="fas fa-file-invoice"></i> الفواتير</a>
            <a href="./purchases.html" class="nav-item active"><i class="fas fa-shopping-cart"></i> المشتريات</a>
            <a href="./returns.html" class="nav-item"><i class="fas fa-undo-alt"></i> المرتجعات</a>
            <a href="./cashbox.html" class="nav-item"><i class="fas fa-money-bill-wave"></i> الصندوق</a>
            <a href="./accounting.html" class="nav-item"><i class="fas fa-calculator"></i> المحاسبة</a>
            <a href="./reports.html" class="nav-item"><i class="fas fa-chart-bar"></i> التقارير</a>
            <a href="./customers.html" class="nav-item"><i class="fas fa-users"></i> العملاء</a>
            <a href="./suppliers.html" class="nav-item"><i class="fas fa-truck"></i> الموردين</a>
            <a href="./products.html" class="nav-item"><i class="fas fa-boxes"></i> المنتجات</a>
            <a href="./inventory.html" class="nav-item"><i class="fas fa-warehouse"></i> المخزون</a>
            <a href="./users.html" class="nav-item"><i class="fas fa-user-shield"></i> المستخدمين</a>
            <a href="./settings.html" class="nav-item"><i class="fas fa-cog"></i> الإعدادات</a>
            <a href="#" class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>

    <!-- ============ المحتوى الرئيسي ============ -->
    <main class="main-container">

        <div class="page-head">
            <div class="page-head__info">
                <h1>المشتريات</h1>
                <p id="purchasesCount">0 فاتورة شراء</p>
            </div>
            <button class="btn btn--primary" id="newPurchaseBtn" type="button">
                <i class="fas fa-plus"></i>
                <span>فاتورة شراء جديدة</span>
            </button>
        </div>

        <!-- ملخص سريع -->
        <div class="summary-cards" id="summaryCards"></div>

        <!-- شريط البحث والفلاتر -->
        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث برقم الفاتورة أو اسم المورد..." autocomplete="off">
                <button class="search-clear" id="clearSearchBtn" style="display:none;" aria-label="مسح البحث" type="button">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <select id="statusFilter" class="filter-select" aria-label="حالة الفاتورة">
                <option value="">كل الحالات</option>
                <option value="paid">مدفوعة</option>
                <option value="partial">جزئية</option>
                <option value="credit">آجلة</option>
            </select>
            <select id="dateFilter" class="filter-select" aria-label="الفترة">
                <option value="">كل الفترات</option>
                <option value="today">اليوم</option>
                <option value="week">هذا الأسبوع</option>
                <option value="month">هذا الشهر</option>
                <option value="year">هذه السنة</option>
            </select>
            <select id="sortFilter" class="filter-select" aria-label="ترتيب">
                <option value="recent">الأحدث</option>
                <option value="oldest">الأقدم</option>
                <option value="amount-desc">الأعلى مبلغاً</option>
                <option value="amount">الأقل مبلغاً</option>
            </select>
        </div>

        <!-- قائمة فواتير المشتريات -->
        <div class="purchases-container">
            <div class="purchases-grid-view" id="purchasesGridView"></div>
            <div class="purchases-list-view" id="purchasesListView"></div>

            <div class="empty-state" id="emptyState" style="display:none;">

                <p>ابدأ بإنشاء فاتورة شراء جديدة</p>
                <button class="btn btn--primary" id="emptyNewPurchaseBtn" type="button">
                    <i class="fas fa-plus"></i> فاتورة شراء
                </button>
            </div>

            <div class="skeleton-grid" id="skeletonGrid" style="display:none;"></div>
        </div>

        <!-- زر عائم -->

    <!-- ============ مودال: اختيار المورد والمنتجات ============ -->
    <div class="modal" id="purchaseModal">
        <div class="modal__content modal__content--lg">
            <div class="modal__header">
                <h2 id="purchaseModalTitle">فاتورة شراء جديدة</h2>
                <button class="icon-btn" data-close="purchaseModal" type="button" aria-label="إغلاق"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal__body">
                <input type="hidden" id="purchaseId">
                <input type="hidden" id="purchaseSupplierId">

                <!-- المورد -->
                <div class="form-section">
                    <div class="form-section__title">
                        <i class="fas fa-truck"></i>
                        بيانات المورد
                    </div>
                    <div class="form-group">
                        <label for="supplierSearchInput">المورد <span class="required">*</span></label>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="supplierSearchInput" placeholder="ابحث عن مورد..." autocomplete="off">
                            <div class="supplier-dropdown" id="supplierDropdown"></div>
                        </div>
                        <div class="selected-supplier" id="selectedSupplier" style="display:none;"></div>
                    </div>
                </div>

                <!-- المنتجات -->
                <div class="form-section">
                    <div class="form-section__title">
                        <i class="fas fa-boxes"></i>
                        المنتجات
                        <button type="button" class="btn-add-unit" id="addItemBtn">
                            <i class="fas fa-plus-circle"></i> إضافة منتج
                        </button>
                    </div>
                    <div class="purchase-items" id="purchaseItems">
                        <div class="purchase-empty">
                            <i class="fas fa-cube"></i>
                            <p>لم تُضف أي منتجات بعد</p>
                        </div>
                    </div>
                </div>

                <!-- الإجماليات -->
                <div class="purchase-totals">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="purchaseDiscount">الخصم</label>
                            <div class="discount-wrap" style="display:flex;gap:6px;">
                                <input type="number" id="purchaseDiscount" value="0" min="0" step="0.01" inputmode="decimal" style="flex:1;">
                                <select id="purchaseDiscountType" style="width:90px;" aria-label="نوع الخصم">
                                    <option value="amount">ج.م</option>
                                    <option value="percent">%</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="purchaseNotes">ملاحظات</label>
                            <input type="text" id="purchaseNotes" placeholder="ملاحظات اختيارية">
                        </div>
                    </div>

                    <div class="totals-preview">
                        <div class="totals-row">
                            <span>الإجمالي الفرعي</span>
                            <strong id="purchaseSubtotal">0.00</strong>
                        </div>
                        <div class="totals-row">
                            <span>الخصم</span>
                            <strong id="purchaseDiscountDisplay">0.00</strong>
                        </div>
                        <div class="totals-row totals-row--final">
                            <span>الصافي</span>
                            <strong id="purchaseNetTotal">0.00</strong>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close="purchaseModal" type="button">إلغاء</button>
                <button class="btn btn--primary" id="savePurchaseBtn" type="button">
                    <i class="fas fa-save"></i> حفظ الفاتورة
                </button>
            </div>
        </div>
    </div>

    <!-- ============ مودال: إضافة منتج للفاتورة ============ -->
    <div class="modal" id="addItemModal">
        <div class="modal__content modal__content--sm">
            <div class="modal__header">
                <h2>إضافة منتج</h2>
                <button class="icon-btn" data-close="addItemModal" type="button" aria-label="إغلاق"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal__body">
                <div class="form-group">
                    <label for="productSearchInput">المنتج <span class="required">*</span></label>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="productSearchInput" placeholder="ابحث بالاسم أو الباركود..." autocomplete="off">
                        <div class="product-dropdown" id="productDropdown"></div>
                    </div>
                    <div class="selected-product" id="selectedProduct" style="display:none;"></div>
                </div>

                <div class="form-group" id="unitSelectionGroup" style="display:none;">
                    <label>الوحدة</label>
                    <div class="unit-chips" id="unitChips"></div>
                </div>

                <div class="form-grid" id="itemDetailsGroup" style="display:none;">
                    <div class="form-group">
                        <label for="itemQuantity">الكمية <span class="required">*</span></label>
                        <input type="number" id="itemQuantity" value="1" min="0.001" step="0.001" inputmode="decimal">
                    </div>
                    <div class="form-group">
                        <label for="itemCost">سعر الشراء <span class="required">*</span></label>
                        <input type="number" id="itemCost" value="0" min="0" step="0.01" inputmode="decimal">
                    </div>
                    <div class="form-group" style="grid-column:1/-1;">
                        <label for="itemPrice">سعر البيع (اختياري)</label>
                        <input type="number" id="itemPrice" value="0" min="0" step="0.01" inputmode="decimal">
                        <small class="form-hint">
                            <i class="fas fa-info-circle"></i>
                            سيتم استخدامه لتحديث سعر البيع في المنتج

                    </div>
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close="addItemModal" type="button">إلغاء</button>
                <button class="btn btn--primary" id="confirmAddItemBtn" type="button" disabled>

            </div>
        </div>
    </div>

    <!-- ============ مودال: تفاصيل فاتورة الشراء ============ -->
    <div class="modal" id="purchaseDetailsModal">
        <div class="modal__content receipt-modal-content">
            <div class="receipt-header">
                <button id="closeDetailsModalBtn" class="close-btn" type="button" aria-label="إغلاق">&times;</button>
            </div>
            <div id="purchaseDetailsContent"></div>
            <div class="receipt-actions" style="flex-wrap:wrap;">
                <button class="btn btn--primary" id="printPurchaseBtn" type="button" style="flex:1;min-width:100px;">
                    <i class="fas fa-print"></i> طباعة
                </button>
                <button class="btn btn--ghost" id="payPurchaseBtn" type="button" style="flex:1;min-width:100px;">
                    <i class="fas fa-hand-holding-usd"></i> سداد
                </button>
                <button class="btn btn--cancel" id="closeDetailsModalBtn2" type="button" style="flex:1;min-width:100px;">

    <!-- ============ مودال: السداد للمورد ============ -->
    <div class="modal" id="paySupplierModal">
        <div class="modal__content modal__content--sm">
            <div class="modal__header">
                <h2>سداد للمورد</h2>
                <button class="icon-btn" data-close="paySupplierModal" type="button" aria-label="إغلاق"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal__body">
                <input type="hidden" id="paySupplierId">

                <div class="payment-target">
                    <div class="payment-target__avatar" id="paySupplierAvatar">S</div>
                    <div class="payment-target__info">
                        <strong id="paySupplierName">-</strong>
                        <small id="paySupplierBalance">-</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="payAmount">المبلغ <span class="required">*</span></label>
                    <input type="number" id="payAmount" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">
                    <div class="quick-amounts" id="payQuickAmounts"></div>
                </div>

                <div class="form-group">
                    <label>طريقة الدفع</label>
                    <div class="payment-methods payment-methods--compact">
                        <button type="button" class="method-btn active" data-method="cash">
                            <i class="fas fa-money-bill-wave"></i>
                            <span>نقدي</span>
                        </button>
                        <button type="button" class="method-btn" data-method="transfer">
                            <i class="fas fa-exchange-alt"></i>
                            <span>تحويل</span>
                        </button>
                        <button type="button" class="method-btn" data-method="card">
                            <i class="fas fa-credit-card"></i>
                            <span>بطاقة</span>
                        </button>
                    </div>
                    <input type="hidden" id="payMethod" value="cash">
                </div>

                <div class="form-group">
                    <label for="payReference">رقم المرجع / الشيك</label>
                    <input type="text" id="payReference" placeholder="اختياري" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="payNotes">ملاحظات</label>
                    <input type="text" id="payNotes" placeholder="اختياري" autocomplete="off">
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close="paySupplierModal" type="button">إلغاء</button>
                <button class="btn btn--success" id="confirmPaySupplierBtn" type="button">
                    <i class="fas fa-check"></i> تأكيد السداد
                </button>
            </div>
        </div>
    </div>

    <div id="toastStack" class="toast-stack"></div>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="./js/config.js"></script>
    <script defer src="./js/utils.js"></script>
    <script defer src="./js/toast.js"></script>
    <script defer src="./js/db.js"></script>
    <script defer src="./js/auth.js"></script>
    <script defer src="./js/purchases.js"></script>

    <!-- Post-load: SW + theme-color + logo fallback + empty-state button -->
    <script>
    (function() {
        'use strict';

        /* ============ فشل تحميل الشعار ============ */
        document.querySelectorAll('.js-logo-fallback').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                const sibling = this.nextElementSibling;
                if (sibling) sibling.style.display = 'grid';
            });
        });

        /* ============ مزامنة theme-color ============ */
        function syncThemeColor() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#1e1b4b' : '#4f46e5');
        }
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(
            document.documentElement,
            { attributes: true, attributeFilter: ['data-theme'] }
        );

        /* ============ empty-state → فاتورة شراء ============ */
        document.getElementById('emptyNewPurchaseBtn')?.addEventListener('click', () => {
            document.getElementById('newPurchaseBtn')?.click();
        });

        /* ============ تسجيل Service Worker ============ */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register(
                        './service-worker.js',
                        { scope: './', updateViaCache: 'none' }
                    );

                    reg.addEventListener('updatefound', () => {
                        const nw = reg.installing;
                        if (!nw) return;
                        nw.addEventListener('statechange', () => {
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                if (confirm('يتوفر تحديث جديد. إعادة التحميل الآن؟')) {
                                    nw.postMessage({ type: 'SKIP_WAITING' });
                                }
                            }
                        });
                    });

                    let reloaded = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (reloaded) return;
                        reloaded = true;
                        window.location.reload();
                    });

                    navigator.serviceWorker.addEventListener('message', (event) => {
                        if (event.data?.type === 'SYNC_NOW' && window.DB?.flushSyncQueue) {
                            window.DB.flushSyncQueue().catch(() => {});
                        }
                    });
                } catch (e) {
                    console.warn('SW registration failed', e);
                }
            });
        }

        /* ============ فحص تحميل Supabase ============ */
        window.addEventListener('load', () => {
            if (typeof window.supabase === 'undefined') {
                const stack = document.getElementById('toastStack');
                if (stack) {
                    const el = document.createElement('div');
                    el.style.cssText = 'padding:12px 22px;background:#ef4444;color:#fff;border-radius:12px;font-weight:700;font-size:14px;';
                    el.textContent = 'فشل تحميل مكتبة الاتصال. تحقق من الإنترنت وأعد التحميل.';
                    stack.appendChild(el);
                }
            }
        });
    })();
    </script>
</body>
