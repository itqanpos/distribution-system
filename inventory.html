<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <title>المخزون · نظام POS</title>
    <meta name="theme-color" content="#14b8a6">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/pos.css">
    <link rel="stylesheet" href="./css/inventory.css">
</head>
<body>
    <div id="loading-bar"></div>
    <div id="offline-banner"><i class="fas fa-wifi"></i> أنت غير متصل</div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <header class="topbar">
        <div class="topbar__left">
            <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
            <div class="brand">
                <div class="brand__logo">
                    <img src="./icons/icon-192x192.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid';">
                    <i class="fas fa-warehouse" style="display:none;"></i>
                </div>
                <div class="brand__text">
                    <span class="brand__name">المخزون</span>
                    <span class="brand__status" id="connStatus">متصل</span>
                </div>
            </div>
        </div>
        <div class="topbar__right">
            <button class="icon-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" id="adjustBtn" title="تسوية مخزون"><i class="fas fa-sliders-h"></i></button>
            <button class="icon-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
            <div class="user-chip"><div class="user-chip__avatar" id="userAvatar">U</div></div>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <div class="brand__logo">
                <img src="./icons/icon-192x192.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid';">
                <i class="fas fa-cash-register" style="display:none;"></i>
            </div>
            <h3 id="sidebarUserName">مدير</h3>
        </div>
        <nav class="sidebar__nav">
            <a href="./dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
            <a href="./pos.html" class="nav-item"><i class="fas fa-cash-register"></i> نقطة البيع</a>
            <a href="./invoices.html" class="nav-item"><i class="fas fa-file-invoice"></i> الفواتير</a>
            <a href="./purchases.html" class="nav-item"><i class="fas fa-shopping-cart"></i> المشتريات</a>
            <a href="./returns.html" class="nav-item"><i class="fas fa-undo-alt"></i> المرتجعات</a>
            <a href="./cashbox.html" class="nav-item"><i class="fas fa-money-bill-wave"></i> الصندوق</a>
            <a href="./accounting.html" class="nav-item"><i class="fas fa-calculator"></i> المحاسبة</a>
            <a href="./reports.html" class="nav-item"><i class="fas fa-chart-bar"></i> التقارير</a>
            <a href="./customers.html" class="nav-item"><i class="fas fa-users"></i> العملاء</a>
            <a href="./suppliers.html" class="nav-item"><i class="fas fa-truck"></i> الموردين</a>
            <a href="./products.html" class="nav-item"><i class="fas fa-boxes"></i> المنتجات</a>
            <a href="./inventory.html" class="nav-item active"><i class="fas fa-warehouse"></i> المخزون</a>
            <a href="./users.html" class="nav-item"><i class="fas fa-user-shield"></i> المستخدمين</a>
            <a href="./settings.html" class="nav-item"><i class="fas fa-cog"></i> الإعدادات</a>
            <a href="#" class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>
    </aside>

    <main class="main-container">
        <div class="page-head">
            <div class="page-head__info">
                <h1>المخزون</h1>
                <p id="inventoryCount">0 منتج</p>
            </div>
            <button class="btn btn--primary" id="adjustMainBtn">
                <i class="fas fa-sliders-h"></i>
                <span>تسوية مخزون</span>
            </button>
        </div>

        <div class="summary-cards" id="summaryCards"></div>

        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن منتج..." autocomplete="off">
                <button class="search-clear" id="clearSearchBtn" style="display:none;"><i class="fas fa-times"></i></button>
            </div>
            <select id="stockFilter" class="filter-select">
                <option value="">كل الحالات</option>
                <option value="out">نفذ (0)</option>
                <option value="low">منخفض (≤5)</option>
                <option value="in">جيد (>5)</option>
            </select>
            <select id="sortFilter" class="filter-select">
                <option value="name">الاسم</option>
                <option value="stock">المخزون (تصاعدي)</option>
                <option value="stock-desc">المخزون (تنازلي)</option>
                <option value="value">القيمة (تصاعدي)</option>
                <option value="value-desc">القيمة (تنازلي)</option>
            </select>
        </div>

        <div class="inventory-container">
            <div class="inventory-grid-view" id="inventoryGridView"></div>
            <div class="inventory-list-view" id="inventoryListView"></div>

            <div class="empty-state" id="emptyState" style="display:none;">
                <i class="fas fa-warehouse"></i>
                <h3>لا توجد منتجات</h3>
                <p>أضف منتجات لعرض مخزونها</p>
            </div>
            <div class="skeleton-grid" id="skeletonGrid" style="display:none;"></div>
        </div>
    </main>

    <!-- مودال تسوية المخزون -->
    <div class="modal" id="adjustModal">
        <div class="modal__content">
            <div class="modal__header">
                <h2>تسوية المخزون</h2>
                <button class="icon-btn" data-close="adjustModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal__body">
                <input type="hidden" id="adjustProductId">

                <div class="form-group">
                    <label>المنتج <span class="required">*</span></label>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="adjustProductSearch" placeholder="ابحث عن منتج..." autocomplete="off">
                        <div class="product-dropdown" id="adjustProductDropdown"></div>
                    </div>
                    <div class="selected-product-info" id="selectedAdjustProduct" style="display:none;"></div>
                </div>

                <div class="form-group" id="adjustUnitGroup" style="display:none;">
                    <label>الوحدة</label>
                    <div class="unit-chips" id="adjustUnitChips"></div>
                </div>

                <div class="form-grid" id="adjustFields" style="display:none;">
                    <div class="form-group">
                        <label>المخزون الحالي</label>
                        <input type="text" id="currentStock" disabled>
                    </div>
                    <div class="form-group">
                        <label>المخزون الجديد <span class="required">*</span></label>
                        <input type="number" id="newStock" min="0" step="0.001" inputmode="decimal">
                    </div>
                </div>

                <div class="form-group" id="adjustReasonGroup" style="display:none;">
                    <label>سبب التسوية</label>
                    <select id="adjustReason">
                        <option value="">اختر سبباً</option>
                        <option value="count">جرد فعلي</option>
                        <option value="damage">تلف</option>
                        <option value="loss">فقدان</option>
                        <option value="return">مرتجع</option>
                        <option value="correction">تصحيح خطأ</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>

                <div class="form-group" id="adjustNotesGroup" style="display:none;">
                    <label>ملاحظات</label>
                    <textarea id="adjustNotes" rows="2" placeholder="ملاحظات اختيارية..."></textarea>
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close="adjustModal">إلغاء</button>
                <button class="btn btn--primary" id="confirmAdjustBtn" disabled>
                    <i class="fas fa-check"></i> حفظ التسوية
                </button>
            </div>
        </div>
    </div>

    <div id="toastStack" class="toast-stack"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/inventory.js"></script>
</body>
</html>
