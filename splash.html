<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <title>حسابي · نظام POS</title>
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="نظام إدارة المبيعات والمخزون والمحاسبة">
    
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حسابي">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-start: #4f46e5;
            --bg-mid: #6366f1;
            --bg-end: #7c3aed;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(20px + var(--safe-top)) calc(20px + var(--safe-right)) calc(20px + var(--safe-bottom)) calc(20px + var(--safe-left));
            position: relative;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* ============ خلفية متحركة ============ */
        .bg-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }
        .shape:nth-child(1) {
            width: 300px; height: 300px;
            top: -100px; right: -100px;
            animation-delay: 0s;
        }
        .shape:nth-child(2) {
            width: 200px; height: 200px;
            bottom: -80px; left: -80px;
            animation-delay: 5s;
        }
        .shape:nth-child(3) {
            width: 150px; height: 150px;
            top: 50%; left: 10%;
            animation-delay: 10s;
        }
        .shape:nth-child(4) {
            width: 100px; height: 100px;
            top: 30%; right: 15%;
            animation-delay: 7s;
        }
        .shape:nth-child(5) {
            width: 80px; height: 80px;
            bottom: 25%; right: 30%;
            animation-delay: 3s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translate(30px, -40px) scale(1.15);
                opacity: 0.8;
            }
        }
        
        /* ============ البطاقة الرئيسية ============ */
        .splash-wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            animation: cardEntry 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        /* ============ الشعار ============ */
        .logo-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: ringPulse 2.5s ease-in-out infinite;
        }
        
        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            animation: ringPulse 2.5s ease-in-out infinite;
            animation-delay: 0.5s;
        }
        
        .logo-ring::after {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.05);
            animation: ringPulse 2.5s ease-in-out infinite;
            animation-delay: 1s;
        }
        
        @keyframes ringPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }
        
        .logo-circle {
            width: 120px;
            height: 120px;
            background: #fff;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 8px rgba(255, 255, 255, 0.1),
                inset 0 -4px 12px rgba(79, 70, 229, 0.15);
            position: relative;
            overflow: hidden;
            animation: logoFloat 3s ease-in-out infinite;
        }
        
        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        
        .logo-circle::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 3s ease-in-out infinite;
        }
        
        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }
        
        .logo-circle img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }
        
        .logo-circle .logo-icon {
            font-size: 52px;
            color: var(--primary);
            position: relative;
            z-index: 1;
        }
        
        /* ============ العنوان ============ */
        .brand-text {
            text-align: center;
            color: #fff;
        }
        
        .brand-text h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 6px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
            animation: textGlow 3s ease-in-out infinite;
        }
        
        @keyframes textGlow {
            0%, 100% {
                text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
            }
            50% {
                text-shadow: 
                    0 4px 12px rgba(0, 0, 0, 0.15),
                    0 0 30px rgba(255, 255, 255, 0.5);
            }
        }
        
        .brand-text .tagline {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.5px;
        }
        
        /* ============ شريط التحميل ============ */
        .progress-container {
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        
        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(4px);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0.7));
            border-radius: 999px;
            width: 0%;
            transition: width 0.4s ease;
            position: relative;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: progressShine 1.5s linear infinite;
        }
        
        @keyframes progressShine {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        
        /* ============ حالة التحميل ============ */
        .status-text {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            justify-content: center;
            min-height: 24px;
            transition: opacity 0.3s;
        }
        
        .status-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            font-size: 14px;
        }
        
        .status-icon.spinning {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-icon.success {
            color: #6ee7b7;
        }
        
        .status-icon.error {
            color: #fca5a5;
        }
        
        /* ============ النقاط المتحركة ============ */
        .dots {
            display: inline-flex;
            gap: 3px;
            margin-right: 2px;
        }
        
        .dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        
        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }
        
        /* ============ رسالة الخطأ ============ */
        .error-panel {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px 20px;
            color: #fff;
            width: 100%;
            text-align: center;
            animation: shakeIn 0.5s;
        }
        
        .error-panel.show {
            display: block;
        }
        
        @keyframes shakeIn {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }
        
        .error-panel i {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
            color: #fca5a5;
        }
        
        .error-panel p {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .retry-btn {
            background: #fff;
            color: var(--danger);
            border: none;
            padding: 10px 24px;
            border-radius: 999px;
            font-family: inherit;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .retry-btn:active {
            transform: translateY(0);
        }
        
        /* ============ معلومات أسفل الشاشة ============ */
        .footer-info {
            position: fixed;
            bottom: calc(20px + var(--safe-bottom));
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-weight: 600;
            z-index: 1;
            padding: 0 20px;
        }
        
        .footer-info .version {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
        }
        
        .footer-info .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .footer-info .connection-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: dotPulse 2s ease-in-out infinite;
        }
        
        .footer-info .connection-dot.offline {
            background: var(--danger);
            animation: none;
        }
        
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }
        
        /* ============ شعار PWA ============ */
        .pwa-badge {
            position: fixed;
            top: calc(16px + var(--safe-top));
            right: calc(16px + var(--safe-right));
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 6px 14px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 2;
            animation: fadeIn 1s ease 0.5s both;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============ Responsive ============ */
        @media (max-width: 480px) {
            .brand-text h1 {
                font-size: 34px;
            }
            .logo-circle {
                width: 100px;
                height: 100px;
                border-radius: 26px;
            }
            .logo-circle .logo-icon {
                font-size: 44px;
            }
            .logo-ring {
                width: 130px;
                height: 130px;
            }
            .splash-wrapper {
                gap: 28px;
            }
        }
        
        @media (max-height: 600px) {
            .splash-wrapper {
                gap: 20px;
            }
            .brand-text h1 {
                font-size: 30px;
            }
            .logo-circle {
                width: 90px;
                height: 90px;
                border-radius: 24px;
            }
            .logo-circle .logo-icon {
                font-size: 38px;
            }
            .logo-ring {
                width: 120px;
                height: 120px;
            }
        }
        
        /* ============ الوضع الداكن ============ */
        [data-theme="dark"] body {
            --bg-start: #1e1b4b;
            --bg-mid: #3730a3;
            --bg-end: #4c1d95;
        }
    </style>
</head>
<body>

    <!-- شعار PWA -->
    <div class="pwa-badge">
        <i class="fas fa-mobile-alt"></i>
        <span>يعمل بدون إنترنت</span>
    </div>

    <!-- الخلفية المتحركة -->
    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="splash-wrapper">
        
        <!-- الشعار -->
        <div class="logo-container">
            <div class="logo-ring"></div>
            <div class="logo-circle">
                <img src="./icons/icon-192x192.png" 
                     alt="حسابي" 
                     onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                <i class="fas fa-store logo-icon" style="display:none;"></i>
            </div>
        </div>

        <!-- العنوان -->
        <div class="brand-text">
            <h1>حسابي</h1>
            <p class="tagline">نظام إدارة الأعمال الذكي</p>
        </div>

        <!-- شريط التحميل -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText">
                <span class="status-icon spinning" id="statusIcon">
                    <i class="fas fa-circle-notch"></i>
                </span>
                <span id="statusLabel">جاري التحميل</span>
                <span class="dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </div>
        </div>

        <!-- رسالة الخطأ -->
        <div class="error-panel" id="errorPanel">
            <i class="fas fa-exclamation-triangle"></i>
            <p id="errorMessage">تعذر الاتصال بالخادم</p>
            <button class="retry-btn" id="retryBtn">
                <i class="fas fa-redo-alt"></i>
                إعادة المحاولة
            </button>
        </div>

    </div>

    <!-- معلومات أسفل الشاشة -->
    <div class="footer-info">
        <div class="version">
            <span class="connection-status">
                <span class="connection-dot" id="connDot"></span>
                <span id="connText">متصل</span>
            </span>
            <span>•</span>
            <span>الإصدار <span id="appVersion">3.0.0</span></span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/auth.js"></script>

    <script>
    (function() {
        'use strict';

        /* ============================================
           عناصر DOM
           ============================================ */
        const progressFill = document.getElementById('progressFill');
        const statusLabel = document.getElementById('statusLabel');
        const statusIcon = document.getElementById('statusIcon');
        const errorPanel = document.getElementById('errorPanel');
        const errorMessage = document.getElementById('errorMessage');
        const retryBtn = document.getElementById('retryBtn');
        const connDot = document.getElementById('connDot');
        const connText = document.getElementById('connText');
        const appVersion = document.getElementById('appVersion');

        /* ============================================
           State
           ============================================ */
        const State = {
            progress: 0,
            startTime: Date.now(),
            minDisplayTime: 1800,   // مدة عرض لا تقل عن 1.8 ثانية
            initTimeout: 12000,     // مهلة التهيئة القصوى
            initialized: false,
            error: null,
            redirected: false
        };

        /* ============================================
           Helpers
           ============================================ */
        function setProgress(value) {
            State.progress = Math.min(100, Math.max(0, value));
            if (progressFill) {
                progressFill.style.width = State.progress + '%';
            }
        }

        function setStatus(text, icon, spinning) {
            if (statusLabel) statusLabel.textContent = text;
            if (statusIcon) {
                statusIcon.innerHTML = `<i class="fas fa-${icon}"></i>`;
                statusIcon.className = 'status-icon' + (spinning ? ' spinning' : '');
            }
        }

        function showError(message) {
            State.error = message;
            if (errorMessage) errorMessage.textContent = message;
            if (errorPanel) errorPanel.classList.add('show');
            setStatus('فشل التحميل', 'times-circle', false);
            if (statusIcon) statusIcon.className = 'status-icon error';
        }

        function hideError() {
            State.error = null;
            if (errorPanel) errorPanel.classList.remove('show');
        }

        function updateConnectionStatus() {
            const online = navigator.onLine;
            if (connDot) connDot.classList.toggle('offline', !online);
            if (connText) connText.textContent = online ? 'متصل' : 'غير متصل';
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /* ============================================
           Initialize App
           ============================================ */
        async function initApp() {
            try {
                hideError();
                setProgress(5);

                // 1. عرض إصدار التطبيق
                if (appVersion && window.APP_CONFIG?.APP_VERSION) {
                    appVersion.textContent = window.APP_CONFIG.APP_VERSION;
                }

                // 2. التحقق من الاتصال
                setStatus('جاري فحص الاتصال', 'wifi', true);
                setProgress(10);
                updateConnectionStatus();
                await wait(200);

                // 3. التحقق من تحميل المكتبات
                setStatus('جاري تحميل المكتبات', 'cog', true);
                setProgress(20);

                let attempts = 0;
                while ((!window.DB?.client || !window.Auth) && attempts < 50) {
                    await wait(100);
                    attempts++;
                }

                if (!window.DB?.client) {
                    throw new Error('لم يتم تحميل النظام بشكل صحيح. حاول تحديث الصفحة.');
                }

                setProgress(35);

                // 4. التحقق من الجلسة
                setStatus('جاري التحقق من الجلسة', 'user-shield', true);
                setProgress(50);

                let user = null;
                if (navigator.onLine) {
                    try {
                        user = await Promise.race([
                            window.Auth.getCurrentUser(),
                            wait(5000).then(() => null)
                        ]);
                    } catch (e) {
                        console.warn('Session check failed:', e);
                    }
                } else {
                    // Offline: محاولة استعادة الجلسة من localStorage
                    if (window.SessionStore?.restoreSession) {
                        window.SessionStore.restoreSession();
                        user = window.SessionStore.user;
                    }
                }

                setProgress(65);

                // 5. تحضير البيانات (اختياري)
                setStatus('جاري تحضير البيانات', 'database', true);
                setProgress(75);

                if (navigator.onLine && user) {
                    // تحميل المنتجات في الخلفية (لا ننتظر)
                    window.DB.getProducts().catch(() => {});
                }

                await wait(300);
                setProgress(85);

                // 6. تحديد الصفحة التالية
                setStatus('جاري التحويل', 'arrow-left', true);
                setProgress(95);

                let targetUrl = './index.html';

                if (user) {
                    if (user.role === 'rep') {
                        targetUrl = './pos.html';
                    } else if (user.role === 'super_admin') {
                        targetUrl = './admin.html';
                    } else {
                        targetUrl = './dashboard.html';
                    }
                    console.log('👤 User logged in →', targetUrl);
                } else {
                    console.log('👤 No user → Login page');
                }

                // 7. انتظار الحد الأدنى لمدة العرض
                const elapsed = Date.now() - State.startTime;
                if (elapsed < State.minDisplayTime) {
                    await wait(State.minDisplayTime - elapsed);
                }

                // 8. تسجيل النجاح
                setProgress(100);
                setStatus('جاهز!', 'check-circle', false);
                if (statusIcon) statusIcon.className = 'status-icon success';

                await wait(300);

                // 9. التحويل
                State.initialized = true;
                State.redirected = true;
                window.location.replace(targetUrl);

            } catch (error) {
                console.error('❌ Splash init error:', error);

                const elapsed = Date.now() - State.startTime;
                if (elapsed < 1000) {
                    await wait(1000 - elapsed);
                }

                showError(error.message || 'حدث خطأ غير متوقع');
                setProgress(0);
            }
        }

        /* ============================================
           Retry Button
           ============================================ */
        retryBtn?.addEventListener('click', () => {
            State.startTime = Date.now();
            setProgress(0);
            initApp();
        });

        /* ============================================
           Connection Events
           ============================================ */
        window.addEventListener('online', () => {
            updateConnectionStatus();
            // إذا فشل التحميل سابقاً، أعد المحاولة تلقائياً
            if (State.error) {
                retryBtn?.click();
            }
        });
        window.addEventListener('offline', updateConnectionStatus);

        /* ============================================
           Timeout Guard
           ============================================ */
        const timeoutGuard = setTimeout(() => {
            if (!State.initialized && !State.error && !State.redirected) {
                showError('انتهت مهلة التحميل. تحقق من اتصالك بالإنترنت ثم أعد المحاولة.');
            }
        }, State.initTimeout);

        /* ============================================
           Theme
           ============================================ */
        function initTheme() {
            const theme = window.U?.ls?.get?.('theme', 'light') || localStorage.getItem('hesaby_theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        }
        initTheme();

        /* ============================================
           Service Worker Registration
           ============================================ */
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        }

        /* ============================================
           Start
           ============================================ */
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        // Cleanup
        window.addEventListener('beforeunload', () => clearTimeout(timeoutGuard));

    })();
    </script>
</body>
</html>
