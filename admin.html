<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>إدارة النظام · حسابي</title>

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حسابي">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#3b82f6">

    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --success-light: #dcfce7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.2s ease;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-light: rgba(99,102,241,0.2);
            --primary-dark: #4f46e5;
            --success: #10b981;
            --success-light: rgba(16,185,129,0.2);
            --danger: #ef4444;
            --danger-light: rgba(239,68,68,0.2);
            --warning: #f59e0b;
            --warning-light: rgba(245,158,11,0.2);
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --border-medium: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #loading-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--primary); width: 0%; z-index: 9999; transition: width 0.3s ease; }

        #offline-banner {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--danger); color: white;
            text-align: center; padding: 6px;
            font-size: 0.8rem; font-weight: 600;
            z-index: 9998; transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        body.offline #offline-banner { transform: translateY(0); }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-surface); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            padding: 0 16px;
            height: calc(56px + var(--safe-top));
            padding-top: var(--safe-top);
            position: sticky; top: 0; z-index: 110;
            flex-shrink: 0;
        }
        .navbar-left, .navbar-right { display: flex; align-items: center; gap: 10px; }
        .menu-toggle { background: none; border: none; color: var(--text-primary); font-size: 1.4rem; cursor: pointer; }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo-text h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
        .nav-actions { position: relative; }
        .navbar-icon-btn {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 1.2rem; transition: all var(--transition);
        }
        .navbar-icon-btn:hover { background: var(--bg-input); color: var(--primary); }

        .more-dropdown {
            position: absolute; top: 48px; left: 0;
            background: var(--bg-surface); border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg); min-width: 200px;
            z-index: 200; display: none; flex-direction: column;
            overflow: hidden; border: 1px solid var(--border-light);
        }
        .more-dropdown.show { display: flex; }
        .more-dropdown a {
            padding: 12px 18px; color: var(--text-primary);
            text-decoration: none; display: flex; align-items: center;
            gap: 10px; font-weight: 500; font-size: 0.85rem; transition: background var(--transition);
        }
        .more-dropdown a:hover { background: var(--bg-input); color: var(--primary); }
        .dropdown-divider { height: 1px; background: var(--border-light); margin: 4px 0; }

        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.35); z-index: 149;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .sidebar-overlay.show { opacity: 1; visibility: visible; }
        .sidebar {
            position: fixed; top: 0; right: -320px; width: 280px; max-width: 85vw;
            height: 100%; background: var(--bg-surface); border-left: 1px solid var(--border-light);
            padding: calc(20px + var(--safe-top)) 12px 20px 12px;
            z-index: 150;
            transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
            overflow-y: auto; box-shadow: var(--shadow-lg);
        }
        .sidebar.open { right: 0; }
        .sidebar-user { text-align: center; margin-bottom: 20px; }
        .sidebar-avatar { width: 64px; height: 64px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-weight: 700; font-size: 1.5rem; }
        .sidebar-user h4 { color: var(--text-primary); }
        .menu { list-style: none; }
        .menu-section { font-size: 0.6rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 12px 8px; }
        .menu-item { display: flex; align-items: center; padding: 12px 14px; color: var(--text-secondary); text-decoration: none; border-radius: var(--radius-sm); font-size: 0.85rem; transition: all var(--transition); }
        .menu-item i { width: 22px; margin-left: 10px; }
        .menu-item:hover { background: var(--bg-input); color: var(--text-primary); }
        .menu-item.active { background: var(--primary-light); color: var(--primary); }

        /* محتوى الصفحة */
        .page-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .page-header h1 { font-size: 1.5rem; font-weight: 800; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all var(--transition);
        }
        .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .stat-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }
        .stat-info h3 { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
        .stat-info .value { font-size: 1.3rem; font-weight: 800; color: var(--text-primary); }
        .stat-icon.blue { background: var(--primary-light); color: var(--primary); }
        .stat-icon.green { background: var(--success-light); color: var(--success); }
        .stat-icon.orange { background: var(--warning-light); color: var(--warning); }
        .stat-icon.red { background: var(--danger-light); color: var(--danger); }

        .filters-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filters-bar input, .filters-bar select {
            padding: 10px 14px;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
        }
        .filters-bar input { flex: 1; min-width: 200px; }

        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th {
            text-align: right; padding: 12px;
            color: var(--text-secondary); font-weight: 700;
            background: var(--bg-input);
            border-bottom: 1px solid var(--border-light);
        }
        .data-table td { padding: 12px; border-bottom: 1px solid var(--border-light); }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover { background: var(--bg-input); }

        .plan-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .plan-active { background: var(--success-light); color: var(--success); }
        .plan-trial { background: var(--primary-light); color: var(--primary); }
        .plan-expired { background: var(--danger-light); color: var(--danger); }

        .action-btn {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all 0.2s;
            margin: 2px;
        }
        .action-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .action-btn.delete { color: var(--danger); }
        .action-btn.delete:hover { background: var(--danger-light); border-color: var(--danger); }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 250;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h2 { font-size: 1.1rem; }
        .modal-header button { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 1.2rem; }
            .filters-bar { flex-direction: column; }
            .filters-bar input, .filters-bar select { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="offline-banner">أنت غير متصل بالإنترنت</div>
    <div id="loading-bar"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <nav class="navbar" id="mainNavbar">
        <div class="navbar-left">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <div class="logo">
                <div class="logo-icon">
                    <img src="./icons/icon-192x192.png" alt="حسابي" style="width:38px;height:38px;object-fit:contain;border-radius:10px;"
                         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                    <i class="fas fa-store" style="display:none;font-size:20px;color:white;"></i>
                </div>
                <div class="logo-text"><h2>حسابي</h2></div>
            </div>
        </div>
        <div class="navbar-right">
            <div class="nav-actions">
                <button class="navbar-icon-btn" id="moreMenuBtn" title="المزيد"><i class="fas fa-ellipsis-v"></i></button>
                <div class="more-dropdown" id="moreDropdown">
                    <a href="./dashboard.html"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <div class="page-header">
            <h1>إدارة النظام</h1>
        </div>

        <!-- إحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-store"></i></div>
                <div class="stat-info"><h3>إجمالي المتاجر</h3><div class="value" id="totalTenants">0</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info"><h3>اشتراكات نشطة</h3><div class="value" id="activeTenants">0</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
                <div class="stat-info"><h3>تجريبية</h3><div class="value" id="trialTenants">0</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red"><i class="fas fa-lock"></i></div>
                <div class="stat-info"><h3>منتهية</h3><div class="value" id="expiredTenants">0</div></div>
            </div>
        </div>

        <!-- فلترة -->
        <div class="filters-bar">
            <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو البريد...">
            <select id="planFilter">
                <option value="">كل الخطط</option>
                <option value="active">نشطة</option>
                <option value="trial">تجريبية</option>
                <option value="expired">منتهية</option>
            </select>
        </div>

        <!-- جدول المتاجر -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>المتجر</th>
                        <th>البريد الإلكتروني</th>
                        <th>الخطة</th>
                        <th>تاريخ الانتهاء</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="tenantsTableBody">
                    <tr><td colspan="5" style="text-align:center;color:var(--text-muted);">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal تغيير الخطة -->
    <div class="modal" id="planModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تغيير خطة الاشتراك</h2>
                <button id="closePlanModal">&times;</button>
            </div>
            <div class="form-group">
                <label>الخطة</label>
                <select id="newPlanSelect">
                    <option value="trial">تجريبية</option>
                    <option value="active">نشطة</option>
                    <option value="expired">منتهية</option>
                </select>
            </div>
            <button class="btn btn-success" id="savePlanBtn">حفظ</button>
        </div>
    </div>

    <div class="toast" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-core.js"></script>
    <script src="./js/supabase-auth.js"></script>
    <script src="./js/db-local.js"></script>
    <script src="./js/supabase-offline.js"></script>
    <script src="./js/supabase-db.js"></script>
    <script src="./js/toast.js"></script>

    <script>
        (() => {
            const loadingBar = document.getElementById('loading-bar');
            const searchInput = document.getElementById('searchInput');
            const planFilter = document.getElementById('planFilter');
            const tableBody = document.getElementById('tenantsTableBody');
            const totalTenantsEl = document.getElementById('totalTenants');
            const activeTenantsEl = document.getElementById('activeTenants');
            const trialTenantsEl = document.getElementById('trialTenants');
            const expiredTenantsEl = document.getElementById('expiredTenants');
            const planModal = document.getElementById('planModal');
            const closePlanModal = document.getElementById('closePlanModal');
            const newPlanSelect = document.getElementById('newPlanSelect');
            const savePlanBtn = document.getElementById('savePlanBtn');
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const moreMenuBtn = document.getElementById('moreMenuBtn');
            const moreDropdown = document.getElementById('moreDropdown');
            const logoutBtn = document.getElementById('logoutBtn');

            let allTenants = [];
            let selectedTenantId = null;
            let currentUser = null;

            function waitForCore(timeoutMs = 8000) {
                return new Promise((resolve, reject) => {
                    const start = Date.now();
                    const check = () => {
                        if (window.App && window.DB) resolve();
                        else if (Date.now() - start > timeoutMs) reject(new Error('Core not loaded'));
                        else setTimeout(check, 200);
                    };
                    check();
                });
            }

            async function loadTenants() {
                try {
                    allTenants = await DB.getAllTenantsData() || [];
                    updateStats();
                    renderTable(allTenants);
                } catch (e) {
                    console.error('Failed to load tenants:', e);
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">فشل تحميل البيانات</td></tr>';
                }
            }

            function updateStats() {
                totalTenantsEl.textContent = allTenants.length;
                activeTenantsEl.textContent = allTenants.filter(t => t.plan === 'active').length;
                trialTenantsEl.textContent = allTenants.filter(t => t.plan === 'trial').length;
                expiredTenantsEl.textContent = allTenants.filter(t => t.plan === 'expired').length;
            }

            function renderTable(tenants) {
                if (!tenants.length) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">لا توجد بيانات</td></tr>';
                    return;
                }
                tableBody.innerHTML = tenants.map(t => {
                    const planClass = t.plan === 'active' ? 'plan-active' : t.plan === 'trial' ? 'plan-trial' : 'plan-expired';
                    const planText = t.plan === 'active' ? 'نشطة' : t.plan === 'trial' ? 'تجريبية' : 'منتهية';
                    return `
                        <tr>
                            <td>${t.name || 'بدون اسم'}</td>
                            <td>${t.email || '-'}</td>
                            <td><span class="plan-badge ${planClass}">${planText}</span></td>
                            <td>${t.expires_at || '-'}</td>
                            <td>
                                <button class="action-btn edit" data-id="${t.id}"><i class="fas fa-edit"></i></button>
                                <button class="action-btn delete" data-id="${t.id}"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }).join('');

                tableBody.querySelectorAll('.action-btn.edit').forEach(btn => {
                    btn.addEventListener('click', () => openPlanModal(btn.dataset.id));
                });
                tableBody.querySelectorAll('.action-btn.delete').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (confirm('هل أنت متأكد من حذف هذا المستأجر؟')) {
                            await deleteTenant(btn.dataset.id);
                        }
                    });
                });
            }

            function filterTenants() {
                const term = searchInput.value.trim().toLowerCase();
                const plan = planFilter.value;
                const filtered = allTenants.filter(t => {
                    const matchesSearch = !term || (t.name && t.name.toLowerCase().includes(term)) || (t.email && t.email.toLowerCase().includes(term));
                    const matchesPlan = !plan || t.plan === plan;
                    return matchesSearch && matchesPlan;
                });
                renderTable(filtered);
            }

            function openPlanModal(tenantId) {
                selectedTenantId = tenantId;
                const tenant = allTenants.find(t => t.id === tenantId);
                if (tenant) newPlanSelect.value = tenant.plan || 'trial';
                planModal.classList.add('open');
            }

            savePlanBtn.addEventListener('click', async () => {
                if (!selectedTenantId) return;
                try {
                    const client = window.supabaseClient;
                    if (client) {
                        const { error } = await client
                            .from('tenants')
                            .update({ plan: newPlanSelect.value })
                            .eq('id', selectedTenantId);
                        if (error) throw error;
                        window.Toast.success('تم تحديث الخطة');
                        planModal.classList.remove('open');
                        await loadTenants();
                    }
                } catch (e) {
                    console.error('Update plan failed:', e);
                    window.Toast.error('فشل تحديث الخطة');
                }
            });

            async function deleteTenant(tenantId) {
                try {
                    await DB.deleteTenant(tenantId);
                    window.Toast.success('تم حذف المتجر');
                    await loadTenants();
                } catch (e) {
                    console.error('Delete tenant failed:', e);
                    window.Toast.error('فشل الحذف');
                }
            }

            searchInput.addEventListener('input', filterTenants);
            planFilter.addEventListener('change', filterTenants);
            closePlanModal.addEventListener('click', () => planModal.classList.remove('open'));
            planModal.addEventListener('click', (e) => {
                if (e.target === planModal) planModal.classList.remove('open');
            });

            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('show');
            });
            sidebarOverlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('show');
            });
            moreMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                moreDropdown.classList.toggle('show');
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.nav-actions')) moreDropdown.classList.remove('show');
            });
            logoutBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                if (confirm('هل أنت متأكد من تسجيل الخروج؟')) await App.logout();
            });

            async function initAdminPage() {
                loadingBar.style.width = '80%';
                try {
                    await waitForCore();
                    const user = await App.getCurrentUser();
                    if (!user || user.role !== 'super_admin') {
                        window.location.href = './dashboard.html';
                        return;
                    }
                    currentUser = user;
                    await loadTenants();
                    loadingBar.style.width = '100%';
                } catch (e) {
                    console.error('Admin init failed:', e);
                    loadingBar.style.background = 'var(--danger)';
                } finally {
                    setTimeout(() => { loadingBar.style.width = '0%'; }, 300);
                }
            }

            initAdminPage();
        })();
    </script>
</body>
</html>
